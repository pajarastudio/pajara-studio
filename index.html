<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#183d2b">
  <meta name="description" content="Customer Dashboard Pajara Studio — Berakar di Tanah Pasundan.">

  <title>Pajara Studio — Customer</title>

  <style>
    :root {
      --green: #183d2b;
      --green-2: #24563d;
      --green-light: #edf4ef;
      --black: #111512;
      --text: #202621;
      --muted: #788078;
      --white: #ffffff;
      --border: #e5e9e5;
      --bg: #f6f8f6;
      --danger: #b84242;
      --warning: #a97919;
      --shadow: 0 10px 30px rgba(24, 61, 43, 0.08);
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 88px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       APP HEADER
    ========================= */

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      height: 68px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -1px;
    }

    .brand-text strong {
      display: block;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .header-profile {
      width: 39px;
      height: 39px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      font-weight: 700;
      font-size: 14px;
    }
